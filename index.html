<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="分细组词卡">
<meta name="theme-color" content="#f4f6f8">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>分细组 · 医学英语词卡</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f3f5f7; --bg2:#e9eef2; --card:#ffffff; --card2:#f8fafb;
  --text:#101418; --text2:#3d4650; --muted:#7b8794; --line:#e3e8ed;
  --accent:#0e9f8e; --accent2:#2dd4bf; --accent-soft:#e2f6f3;
  --red:#e05252; --red-soft:#fdecec; --amber:#d99023; --amber-soft:#fdf3e2;
  --green:#178f62; --green-soft:#e8f6ef; --blue:#3b82f6;
  --shadow:0 10px 30px rgba(16,24,32,.08), 0 2px 8px rgba(16,24,32,.04);
  --radius:22px;
}
:root[data-theme="dark"]{
  --bg:#0b0f12; --bg2:#11171c; --card:#151c22; --card2:#1a232b;
  --text:#f2f5f7; --text2:#c3ccd4; --muted:#8b98a5; --line:#26313a;
  --accent:#2dd4bf; --accent2:#5eead4; --accent-soft:#12332f;
  --red:#f07171; --red-soft:#331b1b; --amber:#e8b45a; --amber-soft:#332817;
  --green:#4ade80; --green-soft:#123024; --blue:#60a5fa;
  --shadow:0 12px 34px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.2);
}
@media (prefers-color-scheme: dark){
  :root[data-theme="auto"]{
    --bg:#0b0f12; --bg2:#11171c; --card:#151c22; --card2:#1a232b;
    --text:#f2f5f7; --text2:#c3ccd4; --muted:#8b98a5; --line:#26313a;
    --accent:#2dd4bf; --accent2:#5eead4; --accent-soft:#12332f;
    --red:#f07171; --red-soft:#331b1b; --amber:#e8b45a; --amber-soft:#332817;
    --green:#4ade80; --green-soft:#123024; --blue:#60a5fa;
    --shadow:0 12px 34px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.2);
  }
}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;
  background:
    radial-gradient(900px 500px at 50% -180px, var(--accent-soft), transparent 70%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  background-attachment:fixed;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  min-height:100dvh;
}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
#app{
  width:100%;max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 240px);
}
@media (min-width:620px){
  body{padding:18px 0}
  #app{border-radius:34px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.18);min-height:calc(100dvh - 36px);border:1px solid var(--line)}
}
#view{padding:calc(14px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));min-height:100vh;min-height:100dvh}
#view.focus{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.5px;box-shadow:0 6px 16px rgba(14,159,142,.28);flex:0 0 auto}
.brand-txt{min-width:0}
.brand-title{font-size:15px;font-weight:800;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.3px}
.icon-btn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--text2);box-shadow:0 2px 6px rgba(0,0,0,.03)}
.icon-btn:active{transform:scale(.94)}
h1,h2,h3,p{margin:0}
.h1{font-size:28px;line-height:1.16;font-weight:850;letter-spacing:-.6px}
.h2{font-size:20px;line-height:1.25;font-weight:800;letter-spacing:-.3px}
.sub{font-size:12.5px;color:var(--muted);line-height:1.6}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.section-title .h2{font-size:16px}
.section-title .link{font-size:12px;color:var(--accent);font-weight:700}
.hero{position:relative;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:var(--shadow);overflow:hidden}
.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-80px;top:-90px;background:radial-gradient(circle,var(--accent-soft),transparent 70%)}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;position:relative;z-index:1}
.hello{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.8px;text-transform:uppercase}
.hero h1{margin-top:6px}
.ring-wrap{width:118px;height:118px;position:relative;flex:0 0 auto}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--line);stroke-width:10}
.ring-fg{fill:none;stroke:url(#ringGrad);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-num{font-size:25px;font-weight:850;letter-spacing:-1px;line-height:1}
.ring-lab{font-size:10px;color:var(--muted);margin-top:4px}
.hero-actions{display:flex;gap:10px;margin-top:16px;position:relative;z-index:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:13px 16px;font-size:14px;font-weight:800;letter-spacing:.1px;transition:transform .12s ease,opacity .12s ease;white-space:nowrap}
.btn:active{transform:scale(.975)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 20px rgba(14,159,142,.24);flex:1}
.btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--text2)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.wide{width:100%}
.btn.sm{padding:9px 12px;border-radius:12px;font-size:12.5px}
.btn[disabled]{opacity:.5;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:19px;font-weight:850;letter-spacing:-.4px}
.stat span{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
.unit-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.unit-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;text-align:left;box-shadow:0 2px 8px rgba(0,0,0,.025);position:relative;overflow:hidden}
.unit-card:active{transform:scale(.985)}
.unit-name{font-size:12.5px;font-weight:800;line-height:1.35;min-height:34px;display:flex;align-items:flex-start}
.unit-meta{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:10px;color:var(--muted)}
.mini-bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
.mini-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.banner{display:flex;gap:9px;align-items:flex-start;background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);color:var(--text2);border-radius:16px;padding:11px 12px;font-size:11.5px;line-height:1.55;margin-bottom:12px}
.banner b{color:var(--amber)}
.search-wrap{position:relative;margin-top:4px}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px 13px 40px;font-size:14px;outline:none;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.search::placeholder{color:var(--muted)}
.search-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.filters{display:flex;flex-wrap:wrap;gap:7px;padding:10px 0 2px}
.chip{flex:0 0 auto;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--text2)}
.chip.active{background:var(--text);border-color:var(--text);color:var(--bg)}
select.chip{appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 10px) 50%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.list-head{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 8px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.4px}
.word-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px;margin-bottom:7px}
.word-row:active{transform:scale(.992)}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--line)}
.dot.new{background:var(--blue)} .dot.learning{background:var(--amber)} .dot.mastered{background:var(--green)}
.word-main{display:block;min-width:0;flex:1}
.word-term{display:block;font-size:14px;font-weight:800;line-height:1.35;word-break:break-word}
.word-zh{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.star{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--muted);flex:0 0 auto}
.star.on{color:#e8a317;background:#fdf3e2}
.flash-wrap{display:flex;flex-direction:column;min-height:calc(100dvh - 120px)}
.study-top{display:flex;align-items:center;gap:10px;padding:4px 0 12px}
.study-progress{flex:1;min-width:0}
.study-progress .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.study-progress .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .35s ease}
.study-progress .meta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:6px;font-weight:700}
.flashcard{width:100%;height:390px;min-height:330px;margin:6px 0 14px;cursor:pointer;user-select:none;-webkit-user-select:none}
.card-inner{position:relative;width:100%;height:100%}
.card-face{position:absolute;inset:0;border-radius:28px;padding:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;opacity:1;transform:translateY(0);transition:opacity .22s ease,transform .22s ease;will-change:opacity,transform;z-index:2}
.card-face:before{content:"";position:absolute;right:-70px;top:-90px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--accent-soft),transparent 68%);pointer-events:none}
.card-face.back{opacity:0;transform:translateY(10px);pointer-events:none;z-index:3;background:linear-gradient(160deg,var(--card),var(--card2))}
.flashcard.flipped .card-face.front{opacity:0;transform:translateY(-10px);pointer-events:none}
.flashcard.flipped .card-face.back{opacity:1;transform:translateY(0);pointer-events:auto}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}
.unit-pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:6px 10px;font-size:10.5px;font-weight:800;letter-spacing:.3px}
.speak{width:38px;height:38px;border-radius:13px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;color:var(--text2)}
.speak:active{transform:scale(.92)}
.term{font-size:40px;line-height:1.12;font-weight:850;letter-spacing:-1.5px;word-break:break-word;margin:auto 0;position:relative;z-index:1;text-align:left}
.term.small{font-size:31px;letter-spacing:-.9px}
.term.xsmall{font-size:25px;letter-spacing:-.4px}
.term-sub{font-size:12px;color:var(--muted);margin-top:10px;font-weight:600;letter-spacing:.2px}
.hint{font-size:11px;color:var(--muted);text-align:center;margin-top:auto;padding-top:12px;letter-spacing:.4px}
.zh{font-size:31px;line-height:1.3;font-weight:850;letter-spacing:-.6px;margin:auto 0 0;position:relative;z-index:1}
.note{font-size:13px;line-height:1.7;color:var(--text2);margin-top:12px;padding:11px 12px;background:var(--card2);border-radius:14px;border:1px solid var(--line);position:relative;z-index:1}
.grade-row{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:9px;margin-top:auto}
.grade{border-radius:18px;padding:14px 8px;font-size:13px;font-weight:850;display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card)}
.grade small{font-size:9.5px;font-weight:600;opacity:.7}
.grade.again{color:var(--red);background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 22%,transparent)}
.grade.hard{color:var(--amber);background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 22%,transparent)}
.grade.good{color:var(--green);background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 22%,transparent)}
.grade:active{transform:scale(.97)}
.kbd-tip{text-align:center;font-size:10px;color:var(--muted);margin-top:12px;display:none}
@media (hover:hover) and (pointer:fine){.kbd-tip{display:block}}
.done{min-height:calc(100dvh - 190px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 8px}
.done-ico{width:82px;height:82px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;margin-bottom:18px;border:1px solid color-mix(in srgb,var(--green) 25%,transparent)}
.done h2{font-size:25px;font-weight:850;letter-spacing:-.6px}
.done p{color:var(--muted);font-size:13px;line-height:1.7;margin-top:8px;max-width:300px}
.done-stats{display:flex;gap:18px;margin-top:20px}
.done-stats b{display:block;font-size:22px;font-weight:850}
.done-stats span{font-size:10px;color:var(--muted)}
.done-actions{display:flex;gap:9px;margin-top:24px;width:100%;max-width:320px}
.quiz-intro{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-top:8px}
.quiz-intro h2{font-size:22px;font-weight:850;letter-spacing:-.5px;margin-bottom:6px}
.quiz-opts{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.quiz-opt{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:15px;font-weight:800;font-size:14px}
.quiz-opt small{color:var(--muted);font-size:11px;font-weight:600}
.quiz-opt:active{transform:scale(.985)}
.quiz-top{display:flex;align-items:center;gap:10px;padding:4px 0 12px}
.quiz-bar{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.quiz-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px;transition:width .3s}
.quiz-count{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
.question-card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px 20px;box-shadow:var(--shadow);margin-top:4px}
.q-dir{font-size:10.5px;font-weight:800;color:var(--accent);letter-spacing:.8px;text-transform:uppercase}
.q-term{font-size:34px;line-height:1.2;font-weight:850;letter-spacing:-1px;margin-top:10px;word-break:break-word}
.q-term.cn{font-size:29px}
.q-note{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.6}
.answers{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.answer{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;font-size:13.5px;font-weight:650;line-height:1.4;min-height:52px}
.answer .letter{width:24px;height:24px;border-radius:8px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:800;flex:0 0 auto;color:var(--muted)}
.answer.correct{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.answer.correct .letter{background:var(--green);color:#fff;border-color:var(--green)}
.answer.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.answer.wrong .letter{background:var(--red);color:#fff;border-color:var(--red)}
.answer[disabled]{opacity:1}
.feedback{display:flex;align-items:flex-start;gap:9px;border-radius:14px;padding:11px 12px;font-size:12px;line-height:1.6;margin-top:12px}
.feedback.ok{background:var(--green-soft);color:var(--green)}
.feedback.no{background:var(--red-soft);color:var(--red)}
.quiz-result{text-align:center;padding:24px 8px}
.score-ring{width:132px;height:132px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--score)*1%), var(--line) 0);position:relative}
.score-ring:after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--card)}
.score-ring b{position:relative;z-index:1;font-size:30px;font-weight:850}
.score-ring span{position:relative;z-index:1;font-size:10px;color:var(--muted);display:block;text-align:center}
.wrong-list{margin-top:18px;text-align:left}
.me-hero{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.avatar{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-weight:850;font-size:18px}
.me-name{font-size:16px;font-weight:850}
.me-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.big-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}
.big-stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.big-stat b{font-size:24px;font-weight:850;letter-spacing:-.8px}
.big-stat span{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
.week{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 14px 12px;margin-top:12px;height:150px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.day-bar{width:100%;max-width:22px;height:76px;background:var(--line);border-radius:7px;min-height:4px;position:relative;overflow:hidden}
.day-bar i{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,var(--accent2),var(--accent));border-radius:7px}
.day.today .day-bar{outline:2px solid var(--accent);outline-offset:1px}
.day span{font-size:9px;color:var(--muted)}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:8px}
.setting .st{font-size:13px;font-weight:750}
.setting .sd{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:6px 9px;border-radius:8px;font-size:10.5px;font-weight:750;color:var(--muted)}
.seg button.active{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.guide{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px;font-size:12px;line-height:1.75;color:var(--text2)}
.guide h3{font-size:13px;font-weight:850;margin-bottom:8px;color:var(--text)}
.guide ol{padding-left:18px;margin:0}
.guide li{margin:5px 0}
.guide code{background:var(--card2);padding:2px 5px;border-radius:5px;font-size:11px}
.tabbar{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  background:var(--card);
  background:color-mix(in srgb,var(--card) 88%,transparent);

}
body.focus .tabbar{display:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:13px;color:var(--muted);font-size:9.5px;font-weight:750;letter-spacing:.2px}
.tab svg{width:21px;height:21px}
.tab.active{color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 15px;border-radius:12px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s ease;z-index:100;max-width:88%;text-align:center;line-height:1.5}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;z-index:90;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.38);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet.open{display:flex}
.sheet-card{width:100%;max-width:560px;background:var(--card);border-radius:26px 26px 0 0;padding:12px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px rgba(0,0,0,.25);animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet-handle{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sheet-word{font-size:25px;font-weight:850;letter-spacing:-.6px;line-height:1.3}
.sheet-zh{font-size:15px;color:var(--text2);margin-top:6px;font-weight:650}
.sheet-note{font-size:12px;line-height:1.7;color:var(--muted);margin-top:10px;background:var(--card2);padding:10px 12px;border-radius:12px}
.sheet-actions{display:flex;gap:8px;margin-top:14px}
.sheet-actions .btn{flex:1}
.empty{text-align:center;color:var(--muted);font-size:12.5px;padding:36px 12px;line-height:1.7}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.footer-note{text-align:center;font-size:10px;color:var(--muted);line-height:1.6;margin-top:26px;padding-bottom:4px}
.kp-hero{background:linear-gradient(150deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-top:10px}
.kp-hero .h2{font-size:22px}

.kp-unit:active{transform:scale(.99)}
.kp-unit .n{font-size:13px;font-weight:800}
.kp-unit .m{font-size:10.5px;color:var(--muted);margin-top:3px}
.kp-qcard{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:var(--shadow);margin-top:6px}
.kp-q{font-size:24px;line-height:1.45;font-weight:850;letter-spacing:-.4px}
.kp-a{font-size:15px;line-height:1.8;color:var(--text2);margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.kp-note{font-size:12px;line-height:1.7;color:var(--muted);margin-top:10px;background:var(--card2);border-radius:12px;padding:10px 12px}
.kp-src{font-size:10.5px;color:var(--muted);margin-top:10px}
.slide-img{width:100%;display:block;border-radius:14px;border:1px solid var(--line);background:#fff}
.slide-cap{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.6}
.reward-overlay{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(8,12,16,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.reward-overlay.show{display:flex}
.reward-card{width:100%;max-width:360px;background:var(--card);border-radius:26px;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:pop .28s cubic-bezier(.2,.9,.2,1.1);text-align:center}
@keyframes pop{from{transform:scale(.86);opacity:.4}to{transform:scale(1);opacity:1}}
.reward-img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:18px;background:var(--card2)}
.reward-meta{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:10px;font-size:11px;color:var(--muted)}
.reward-meta b{color:var(--text);font-size:13px}
.reward-quote{font-size:16px;font-weight:850;margin-top:6px;letter-spacing:-.3px}
.reward-close{margin-top:10px;width:100%}
.reward-badge{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 9px;font-size:10px;font-weight:800}
.reward-badge.bad{background:var(--red-soft);color:var(--red)}
.random-top{display:flex;align-items:center;gap:10px;padding:4px 0 12px}
.random-card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px 20px;box-shadow:var(--shadow);min-height:300px;display:flex;flex-direction:column}
.random-type{font-size:10.5px;font-weight:800;color:var(--accent);letter-spacing:.8px}
.random-prompt{font-size:30px;line-height:1.35;font-weight:850;letter-spacing:-.8px;margin:16px 0;word-break:break-word}
.random-prompt.cn{font-size:25px}
.random-answer{font-size:14px;line-height:1.85;color:var(--text2);margin-top:6px;padding-top:14px;border-top:1px solid var(--line)}
@media (max-width:360px){
  #view{padding-left:13px;padding-right:13px}
  .term{font-size:33px}
  .term.small{font-size:27px}
  .term.xsmall{font-size:22px}
  .flashcard{height:360px}
}
</style>

<script>

},{"u":"u12","t":"chromatin remodeling","zh":"染色质重塑","note":"改变染色质可及性"},{"u":"u12","t":"histone modification","zh":"组蛋白修饰","note":"乙酰化、甲基化等"},{"u":"u12","t":"acetylation","zh":"乙酰化","note":"通常使染色质松散"},{"u":"u12","t":"transcription","zh":"转录","note":"以 DNA 为模板合成 RNA"},{"u":"u12","t":"translation","zh":"翻译","note":"以 mRNA 为模板合成蛋白质"},{"u":"u12","t":"central dogma","zh":"中心法则","note":"DNA→RNA→蛋白质"},{"u":"u12","t":"RNA processing","zh":"RNA 加工","note":"加帽、剪接、加尾"},{"u":"u12","t":"nucleolus","zh":"核仁","note":"rRNA 合成和核糖体组装场所"},{"u":"u12","t":"fibrillar center (FC)","zh":"纤维中心","note":"核仁中央的浅染区"},{"u":"u12","t":"dense fibrillar component (DFC)","zh":"致密纤维组分","note":"rRNA 加工区域"},{"u":"u12","t":"granular component (GC)","zh":"颗粒组分","note":"核糖体前体组装区域"},{"u":"u12","t":"nucleolar organizer region (NOR)","zh":"核仁组织者","note":"含 rRNA 基因的染色体襻环"},{"u":"u12","t":"ribonucleoprotein (RNP)","zh":"核糖核蛋白","note":"RNA 与蛋白质的复合物"},{"u":"u12","t":"Philadelphia chromosome","zh":"费城染色体","note":"BCR-ABL 融合，见于白血病"},{"u":"u12","t":"fluorescence in situ hybridization (FISH)","zh":"荧光原位杂交","note":"定位特定 DNA 序列"}];
const KP = [{"id":"k1","u":"u1","q":"组织学研究的对象和任务是什么？","a":"研究正常人体微细结构及其相关功能，是重要的形态学基础学科。","note":"与病理学对照记忆：组织学看“正常”，病理学看“异常”。","pdf":"上皮组织.pdf","page":3,"slide":"assets/slides/kp_01_u1.webp"},{"id":"k2","u":"u1","q":"人体有哪四大基本组织？","a":"上皮组织、结缔组织、肌组织、神经组织。","note":"四大基本组织由不同细胞和细胞外基质构成。","pdf":"上皮组织.pdf","page":4,"slide":"assets/slides/kp_02_u1.webp"},{"id":"k3","u":"u1","q":"H-E 染色的原理和颜色是什么？","a":"苏木精为碱性染料，使嗜碱性物质（核酸、核糖体）呈紫蓝色；伊红为酸性染料，使嗜酸性物质（胞质、胶原）呈粉红色。","note":"H-E 是最常用的常规染色。","pdf":"上皮组织.pdf","page":9,"slide":"assets/slides/kp_03_u1.webp"},{"id":"k4","u":"u1","q":"PAS 反应显示什么？","a":"过碘酸把糖类氧化成醛，醛与 Schiff 试剂结合形成紫红色沉淀，用于显示糖原、黏液和基膜等。","note":"PAS 阳性 = 紫红色。","pdf":"上皮组织.pdf","page":11,"slide":"assets/slides/kp_04_u1.webp"},{"id":"k5","u":"u1","q":"透射电镜和扫描电镜有什么区别？","a":"TEM 让电子穿透标本，观察细胞内部超微结构；SEM 收集表面二次电子，观察细胞或组织表面立体形态。","note":"TEM 看“里面”，SEM 看“表面”。","pdf":"上皮组织.pdf","page":18,"slide":"assets/slides/kp_05_u1.webp"},{"id":"k6","u":"u1","q":"冷冻电镜的优势是什么？","a":"快速冷冻把样品固定在近生理状态，无需染色和包埋，可解析生物大分子近原子分辨率结构。","note":"2017 年诺贝尔化学奖。","pdf":"上皮组织.pdf","page":19,"slide":"assets/slides/kp_06_u1.webp"},{"id":"k7","u":"u1","q":"细胞学说的核心内容是什么？","a":"细胞是生物体结构和功能的基本单位；一切生物由细胞组成；细胞来自已有细胞。","note":"Schleiden、Schwann 提出，Virchow 补充“细胞来自细胞”。","pdf":"2026.9 分子细胞与组织 绪论 - 学生.pdf","page":18,"slide":"assets/slides/kp_07_u1.webp"},{"id":"k8","u":"u1","q":"分辨率指的是什么？","a":"能分辨两点之间的最小距离；光镜约 0.2 μm，电镜约 0.2 nm。","note":"分辨率越小，看得越细。","pdf":"2026.9 分子细胞与组织 绪论 - 学生.pdf","page":85,"slide":"assets/slides/kp_08_u1.webp"},{"id":"k9","u":"u2","q":"被覆上皮按层数和细胞形态如何分类？","a":"按层数分单层、复层；按形态分扁平、立方、柱状；另有复层扁平上皮和变移上皮等特殊类型。","note":"先看层数，再看表层细胞形态。","pdf":"上皮组织.pdf","page":30,"slide":"assets/slides/kp_09_u2.webp"},{"id":"k10","u":"u2","q":"微绒毛的结构和功能是什么？","a":"上皮细胞游离面伸出的指状突起，直径约 0.1 μm，内含纵行微丝，可扩大细胞表面积，利于吸收。","note":"光镜下小肠的纹状缘、肾小管的刷状缘就是微绒毛。","pdf":"上皮组织.pdf","page":44,"slide":"assets/slides/kp_10_u2.webp"},{"id":"k11","u":"u2","q":"纤毛的“9+2”结构是什么？","a":"纤毛核心为微管轴，周围 9 组二联微管围绕中央 2 根单微管，由基体调控，可定向摆动。","note":"动纤毛能运动；静纤毛其实是长微绒毛。","pdf":"上皮组织.pdf","page":47,"slide":"assets/slides/kp_11_u2.webp"},{"id":"k12","u":"u2","q":"紧密连接的结构和功能是什么？","a":"相邻细胞膜紧密相贴，封闭细胞间隙，形成屏障，阻止物质从细胞间隙通过。","note":"位于连接复合体最深层。","pdf":"上皮组织.pdf","page":57,"slide":"assets/slides/kp_12_u2.webp"},{"id":"k13","u":"u2","q":"桥粒的结构和功能是什么？","a":"相邻细胞间形成桥粒斑，胞质内有张力丝附着，提供牢固的机械连接，耐摩擦和牵拉。","note":"复层扁平上皮中多见。","pdf":"上皮组织.pdf","page":59,"slide":"assets/slides/kp_13_u2.webp"},{"id":"k14","u":"u2","q":"缝隙连接如何实现细胞间通讯？","a":"相邻细胞膜上有由 6 个连接蛋白组成的连接子，形成 2 nm 通道，允许小分子和离子通过。","note":"心肌闰盘、平滑肌中常见。","pdf":"上皮组织.pdf","page":60,"slide":"assets/slides/kp_14_u2.webp"},{"id":"k15","u":"u2","q":"基膜的组成和功能是什么？","a":"基膜位于上皮与结缔组织之间，由基板和网板构成，起支持、连接和滤过作用。","note":"基板含 IV 型胶原、层粘连蛋白等。","pdf":"上皮组织.pdf","page":62,"slide":"assets/slides/kp_15_u2.webp"},{"id":"k16","u":"u2","q":"杯状细胞的结构和功能是什么？","a":"杯状细胞是分泌黏液的腺细胞，顶部充满黏原颗粒，PAS 阳性，分泌黏液润滑和保护上皮。","note":"见于呼吸道、肠道上皮。","pdf":"上皮组织.pdf","page":67,"slide":"assets/slides/kp_16_u2.webp"},{"id":"k17","u":"u3","q":"疏松结缔组织由哪些成分构成？","a":"由细胞、纤维和基质构成；细胞少、纤维疏松、基质多，分布于器官之间和血管周围。","note":"固有结缔组织中最典型的一种。","pdf":"固有结缔组织.pdf","page":10,"slide":"assets/slides/kp_17_u3.webp"},{"id":"k18","u":"u3","q":"胶原纤维的结构特点是什么？","a":"主要由 I、III 型胶原蛋白构成，有 64/67 nm 周期性横纹，H-E 染色嗜酸性，韧性大。","note":"胶原纤维由胶原原纤维组成。","pdf":"固有结缔组织.pdf","page":11,"slide":"assets/slides/kp_18_u3.webp"},{"id":"k19","u":"u3","q":"弹性纤维的组成和功能是什么？","a":"由弹性蛋白和微原纤维构成，折光性强，可拉伸回弹，赋予组织弹性。","note":"皮肤、肺、弹性动脉中丰富。","pdf":"固有结缔组织.pdf","page":13,"slide":"assets/slides/kp_19_u3.webp"},{"id":"k20","u":"u3","q":"基质的主要成分和功能是什么？","a":"基质是无定形胶状物，含蛋白多糖、糖蛋白和组织液，起支持、连接、保水和物质交换作用。","note":"蛋白多糖形成分子筛。","pdf":"固有结缔组织.pdf","page":16,"slide":"assets/slides/kp_20_u3.webp"},{"id":"k21","u":"u3","q":"成纤维细胞的结构和功能是什么？","a":"胞体大、多突起，富含 RER 和高尔基体，合成胶原纤维、弹性纤维和基质。","note":"纤维细胞是其静止状态。","pdf":"固有结缔组织.pdf","page":23,"slide":"assets/slides/kp_21_u3.webp"},{"id":"k22","u":"u3","q":"巨噬细胞的功能有哪些？","a":"来源于单核细胞，具有吞噬、抗原提呈、分泌细胞因子和参与免疫调节等功能。","note":"表面有受体和 MHC 分子。","pdf":"固有结缔组织.pdf","page":32,"slide":"assets/slides/kp_22_u3.webp"},{"id":"k23","u":"u3","q":"浆细胞的结构和功能是什么？","a":"来源于 B 淋巴细胞，核偏位呈车轮状，富含 RER，分泌抗体参与体液免疫。","note":"浆细胞 = 抗体工厂。","pdf":"固有结缔组织.pdf","page":36,"slide":"assets/slides/kp_23_u3.webp"},{"id":"k24","u":"u3","q":"肥大细胞的功能是什么？","a":"胞质含粗大嗜碱性颗粒，释放组胺、肝素和白三烯等，参与过敏反应和炎症。","note":"颗粒异染性，甲苯胺蓝染色。","pdf":"固有结缔组织.pdf","page":38,"slide":"assets/slides/kp_24_u3.webp"},{"id":"k25","u":"u4","q":"肌节的定义和组成是什么？","a":"相邻两条 Z 线之间的一段肌原纤维，由粗肌丝和细肌丝规律排列组成，是肌收缩的基本单位。","note":"收缩时 I 带、H 带变短，A 带不变。","pdf":"肌组织.pdf","page":8,"slide":"assets/slides/kp_25_u4.webp"},{"id":"k26","u":"u4","q":"粗肌丝由什么构成？","a":"由肌球蛋白分子规律排列而成，杆部固定于 M 线，头部形成横桥并具有 ATP 酶活性。","note":"粗肌丝贯穿暗带。","pdf":"肌组织.pdf","page":10,"slide":"assets/slides/kp_26_u4.webp"},{"id":"k27","u":"u4","q":"细肌丝由哪些蛋白构成？","a":"由肌动蛋白、原肌球蛋白和肌钙蛋白组成；肌动蛋白形成双股螺旋。","note":"细肌丝一端附着于 Z 线。","pdf":"肌组织.pdf","page":11,"slide":"assets/slides/kp_27_u4.webp"},{"id":"k28","u":"u4","q":"横小管的结构和功能是什么？","a":"肌膜向肌浆内凹陷形成的小管，位于 A/I 带交界处，可把兴奋传入肌纤维内部。","note":"心肌横小管位于 Z 线水平。","pdf":"肌组织.pdf","page":13,"slide":"assets/slides/kp_28_u4.webp"},{"id":"k29","u":"u4","q":"三联体由什么组成？","a":"一条横小管及其两侧的终池组成。","note":"心肌为二联体。","pdf":"肌组织.pdf","page":14,"slide":"assets/slides/kp_29_u4.webp"},{"id":"k30","u":"u4","q":"兴奋-收缩偶联的关键步骤是什么？","a":"动作电位经横小管传入，终池释放 Ca²⁺，Ca²⁺ 与肌钙蛋白结合，触发横桥周期和肌丝滑行。","note":"Ca²⁺ 是偶联的关键离子。","pdf":"肌组织.pdf","page":15,"slide":"assets/slides/kp_30_u4.webp"},{"id":"k31","u":"u4","q":"闰盘的结构和功能是什么？","a":"心肌细胞间的连接结构，位于 Z 线水平，含桥粒、缝隙连接等，既牢固连接又允许电活动传导。","note":"心肌特有的结构。","pdf":"肌组织.pdf","page":21,"slide":"assets/slides/kp_31_u4.webp"},{"id":"k32","u":"u4","q":"骨骼肌、心肌、平滑肌的主要区别是什么？","a":"骨骼肌多核、横纹明显、受躯体运动神经支配；心肌有横纹和闰盘、不随意；平滑肌无横纹、梭形、不随意。","note":"从横纹、核位置、闰盘和神经支配比较。","pdf":"肌组织.pdf","page":35,"slide":"assets/slides/kp_32_u4.webp"},{"id":"k33","u":"u5","q":"透明软骨的结构特点是什么？","a":"软骨细胞位于软骨陷窝，基质呈均质状，含 II 型胶原原纤维，表面有软骨膜。","note":"关节软骨、肋软骨、气管软骨。","pdf":"软骨、骨、血液.pdf","page":9,"slide":"assets/slides/kp_33_u5.webp"},{"id":"k34","u":"u5","q":"骨单位的组成是什么？","a":"骨单位又称哈佛系统，由中央管及其周围同心圆排列的骨板构成，是密质骨的基本结构单位。","note":"中央管内含血管和神经。","pdf":"软骨、骨、血液.pdf","page":30,"slide":"assets/slides/kp_34_u5.webp"},{"id":"k35","u":"u5","q":"破骨细胞的结构和功能是什么？","a":"多核大细胞，位于骨吸收陷窝，靠质子泵和溶酶体酶溶解骨基质，负责骨吸收。","note":"与成骨细胞协同参与骨改建。","pdf":"软骨、骨、血液.pdf","page":23,"slide":"assets/slides/kp_35_u5.webp"},{"id":"k36","u":"u5","q":"软骨内成骨的基本过程是什么？","a":"先形成透明软骨雏形，再出现初级骨化中心、次级骨化中心，软骨逐步被骨组织替换，骺板保留生长。","note":"长骨发生的主要方式。","pdf":"软骨、骨、血液.pdf","page":46,"slide":"assets/slides/kp_36_u5.webp"},{"id":"k37","u":"u5","q":"血浆和血清有什么区别？","a":"血浆是血液的液体成分，含纤维蛋白原；血清是血浆去除纤维蛋白原后的液体。","note":"血清 = 血浆 - 纤维蛋白原。","pdf":"软骨、骨、血液.pdf","page":51,"slide":"assets/slides/kp_37_u5.webp"},{"id":"k38","u":"u5","q":"红细胞的结构和功能是什么？","a":"成熟红细胞无核无细胞器，呈双凹圆盘状，含血红蛋白，运输 O₂ 和 CO₂。","note":"血红蛋白是主要载氧蛋白。","pdf":"软骨、骨、血液.pdf","page":54,"slide":"assets/slides/kp_38_u5.webp"},{"id":"k39","u":"u5","q":"白细胞如何分类？","a":"按胞质有无特殊颗粒分粒细胞和无粒细胞；粒细胞包括中性、嗜酸性、嗜碱性粒细胞，无粒细胞包括单核细胞和淋巴细胞。","note":"中性粒细胞最多，参与急性炎症。","pdf":"软骨、骨、血液.pdf","page":59,"slide":"assets/slides/kp_39_u5.webp"},{"id":"k40","u":"u5","q":"血小板的结构和功能是什么？","a":"血小板是无核的胞质小体，含颗粒和管道系统，参与止血和凝血。","note":"由巨核细胞胞质脱落形成。","pdf":"软骨、骨、血液.pdf","page":66,"slide":"assets/slides/kp_40_u5.webp"},{"id":"k41","u":"u6","q":"氨基酸如何连接成肽链？","a":"一个氨基酸的羧基与另一个氨基酸的氨基脱去一分子水，形成肽键。","note":"肽键具有部分双键性质。","pdf":"第二节 蛋白质_蔡蓉.pdf","page":4,"slide":"assets/slides/kp_41_u6.webp"},{"id":"k42","u":"u6","q":"饱和脂肪酸和不饱和脂肪酸有什么区别？","a":"饱和脂肪酸不含 C=C，碳链直；不饱和脂肪酸含 C=C，体内常为顺式，使碳链弯曲。","note":"顺式不饱和脂肪酸影响膜流动性。","pdf":"第二章第一节 细胞的化学组成_蔡蓉.pdf","page":27,"slide":"assets/slides/kp_42_u6.webp"},{"id":"k43","u":"u6","q":"磷脂为什么能形成生物膜？","a":"磷脂是两亲性分子，亲水头朝向水，疏水尾相对排列，可自发形成脂双层。","note":"膜脂的主要成分。","pdf":"第二章第一节 细胞的化学组成_蔡蓉.pdf","page":26,"slide":"assets/slides/kp_43_u6.webp"},{"id":"k44","u":"u6","q":"核苷酸由哪三部分组成？","a":"由碱基、戊糖和磷酸组成；核苷 = 碱基 + 戊糖，核苷酸 = 核苷 + 磷酸。","note":"DNA 和 RNA 的基本单位。","pdf":"第二章第一节 细胞的化学组成_蔡蓉.pdf","page":46,"slide":"assets/slides/kp_44_u6.webp"},{"id":"k45","u":"u6","q":"嘌呤和嘧啶分别包括哪些碱基？","a":"嘌呤包括腺嘌呤（A）和鸟嘌呤（G）；嘧啶包括胞嘧啶（C）、胸腺嘧啶（T）和尿嘧啶（U）。","note":"T 只在 DNA，U 只在 RNA。","pdf":"第二章第一节 细胞的化学组成_蔡蓉.pdf","page":39,"slide":"assets/slides/kp_45_u6.webp"},{"id":"k46","u":"u6","q":"核糖和脱氧核糖有什么区别？","a":"核糖是 RNA 的戊糖，2' 位有羟基；脱氧核糖是 DNA 的戊糖，2' 位脱去羟基。","note":"脱氧 = 2' 位少一个氧。","pdf":"第二章第一节 细胞的化学组成_蔡蓉.pdf","page":43,"slide":"assets/slides/kp_46_u6.webp"},{"id":"k47","u":"u6","q":"ATP 为什么被称为能量货币？","a":"ATP 含两个高能磷酸键，水解时释放大量能量，供细胞各项生命活动使用。","note":"ATP ↔ ADP + Pi 是能量转换的核心。","pdf":"第二章第一节 细胞的化学组成_蔡蓉.pdf","page":39,"slide":"assets/slides/kp_47_u6.webp"},{"id":"k48","u":"u6","q":"什么是构件分子？","a":"构件分子是构成生物大分子的小分子单元，如氨基酸、核苷酸、单糖和脂肪酸。","note":"大分子 = 构件分子聚合而成。","pdf":"第二章第一节 细胞的化学组成_蔡蓉.pdf","page":4,"slide":"assets/slides/kp_48_u6.webp"},{"id":"k49","u":"u7","q":"蛋白质一级结构的定义是什么？","a":"指肽链中氨基酸残基的排列顺序，从 N 端到 C 端。","note":"一级结构决定高级结构。","pdf":"第二节 蛋白质_蔡蓉.pdf","page":24,"slide":"assets/slides/kp_49_u7.webp"},{"id":"k50","u":"u7","q":"α-螺旋的结构特点是什么？","a":"右手螺旋，每圈约 3.6 个氨基酸残基，螺距约 0.54 nm，侧链伸向螺旋外侧。","note":"氢键维持螺旋。","pdf":"第二节 蛋白质_蔡蓉.pdf","page":33,"slide":"assets/slides/kp_50_u7.webp"},{"id":"k51","u":"u7","q":"蛋白质四级结构的定义是什么？","a":"由两条或两条以上具有独立三级结构的肽链（亚基）通过非共价键聚合而成。","note":"亚基单独存在时通常无活性。","pdf":"第二节 蛋白质_蔡蓉.pdf","page":52,"slide":"assets/slides/kp_51_u7.webp"},{"id":"k52","u":"u7","q":"分子伴侣的作用是什么？","a":"协助新生肽链折叠、组装和转运，防止错误折叠和聚集，但不进入最终产物。","note":"热休克蛋白是重要成员。","pdf":"第二节 蛋白质_蔡蓉.pdf","page":17,"slide":"assets/slides/kp_52_u7.webp"},{"id":"k53","u":"u7","q":"别构效应是什么？","a":"配体与蛋白质特定位点结合后引起构象改变，从而改变蛋白质活性。","note":"血红蛋白结合氧就是典型例子。","pdf":"第二节 蛋白质_蔡蓉.pdf","page":57,"slide":"assets/slides/kp_53_u7.webp"},{"id":"k54","u":"u7","q":"蛋白质变性后哪些结构被破坏？","a":"空间结构（二级、三级、四级）被破坏，一级结构保留；溶解度降低、生物活性丧失。","note":"变性不等于肽键断裂。","pdf":"第二节 蛋白质_蔡蓉.pdf","page":30,"slide":"assets/slides/kp_54_u7.webp"},{"id":"k55","u":"u7","q":"蛋白质家族和超家族有什么区别？","a":"家族成员序列、结构和功能相似；超家族成员同源性更低但结构折叠相似，可含多个家族。","note":"越往后同源性越低。","pdf":"第二节 蛋白质_蔡蓉.pdf","page":66,"slide":"assets/slides/kp_55_u7.webp"},{"id":"k56","u":"u7","q":"亚基是什么？","a":"四级结构中每条具有独立三级结构的肽链称为亚基。","note":"亚基之间靠非共价键结合。","pdf":"第二节 蛋白质_蔡蓉.pdf","page":20,"slide":"assets/slides/kp_56_u7.webp"},{"id":"k57","u":"u8","q":"DNA 双螺旋模型的特点是什么？","a":"两条反向平行的多核苷酸链围绕共同轴形成右手双螺旋，磷酸-脱氧核糖骨架在外，碱基对在内。","note":"B 型 DNA 最接近生理状态。","pdf":"第三节 核酸_蔡蓉.pdf","page":20,"slide":"assets/slides/kp_57_u8.webp"},{"id":"k58","u":"u8","q":"Chargaff 规则的 content 是什么？","a":"双链 DNA 中 A=T、G=C，因此 A+G=T+C。","note":"碱基互补配对的化学基础。","pdf":"第三节 核酸_蔡蓉.pdf","page":12,"slide":"assets/slides/kp_58_u8.webp"},{"id":"k59","u":"u8","q":"核小体的组成是什么？","a":"由 DNA 缠绕组蛋白八聚体（H2A、H2B、H3、H4 各两分子）构成，H1 参与进一步包装。","note":"约 146 bp DNA 绕 1.75 圈。","pdf":"第三节 核酸_蔡蓉.pdf","page":63,"slide":"assets/slides/kp_59_u8.webp"},{"id":"k60","u":"u8","q":"mRNA、tRNA、rRNA 的功能分别是什么？","a":"mRNA 携带遗传信息作为翻译模板；tRNA 转运氨基酸并识别密码子；rRNA 是核糖体的结构和催化组分。","note":"三者都参与蛋白质合成。","pdf":"第三节 核酸_蔡蓉.pdf","page":60,"slide":"assets/slides/kp_60_u8.webp"},{"id":"k61","u":"u8","q":"真核 mRNA 转录后加工包括哪些步骤？","a":"加 5' 帽、剪接去除内含子、3' 端加 poly(A) 尾，有时还有 RNA 编辑。","note":"成熟 mRNA 才能出核翻译。","pdf":"第三节 核酸_蔡蓉.pdf","page":71,"slide":"assets/slides/kp_61_u8.webp"},{"id":"k62","u":"u8","q":"miRNA 的作用机制是什么？","a":"与靶 mRNA 互补结合，抑制翻译或促进 mRNA 降解，从而负调控基因表达。","note":"miRNA 属于小非编码 RNA。","pdf":"第三节 核酸_蔡蓉.pdf","page":60,"slide":"assets/slides/kp_62_u8.webp"},{"id":"k63","u":"u8","q":"核酸的 Tm 是什么？","a":"Tm 是熔解温度，即双链 DNA 有一半解链成单链时的温度。","note":"GC 含量越高，Tm 越高。","pdf":"第三节 核酸_蔡蓉.pdf","page":80,"slide":"assets/slides/kp_63_u8.webp"},{"id":"k64","u":"u8","q":"基因组、转录组和蛋白质组有什么区别？","a":"基因组是一个生物体全部遗传信息；转录组是全部转录本；蛋白质组是全部蛋白质。","note":"分别对应 DNA、RNA、蛋白质层面。","pdf":"第三节 核酸_蔡蓉.pdf","page":73,"slide":"assets/slides/kp_64_u8.webp"},{"id":"k65","u":"u9","q":"流动镶嵌模型的核心观点是什么？","a":"生物膜以流动的脂双层为骨架，蛋白质镶嵌、贯穿或附着在脂双层上，膜具有流动性和不对称性。","note":"膜脂和膜蛋白都能运动。","pdf":"细胞骨架质膜课件2026.pdf","page":45,"slide":"assets/slides/kp_65_u9.webp"},{"id":"k66","u":"u9","q":"膜蛋白有哪几种存在方式？","a":"跨膜蛋白、整合膜蛋白和周围膜蛋白；跨膜蛋白可单次或多次跨膜。","note":"整合膜蛋白穿膜或锚入脂单层。","pdf":"细胞骨架质膜课件2026.pdf","page":59,"slide":"assets/slides/kp_66_u9.webp"},{"id":"k67","u":"u9","q":"微管的结构和功能是什么？","a":"由 α/β 微管蛋白二聚体组成的中空管，直径约 25 nm，参与维持形态、胞内运输、纺锤体和纤毛运动。","note":"微管有极性，正端生长快。","pdf":"细胞骨架质膜课件2026.pdf","page":5,"slide":"assets/slides/kp_67_u9.webp"},{"id":"k68","u":"u9","q":"微丝的结构和功能是什么？","a":"由肌动蛋白组成的细丝，直径约 7 nm，参与细胞形态维持、运动、胞质分裂和微绒毛支架。","note":"微丝有极性，正端聚合快。","pdf":"细胞骨架质膜课件2026.pdf","page":5,"slide":"assets/slides/kp_68_u9.webp"},{"id":"k69","u":"u9","q":"中间丝的特点是什么？","a":"直径约 10 nm，由组织特异性中间丝蛋白组成，如角蛋白、波形蛋白、核纤层蛋白，主要提供机械支撑。","note":"中间丝无极性。","pdf":"细胞骨架质膜课件2026.pdf","page":6,"slide":"assets/slides/kp_69_u9.webp"},{"id":"k70","u":"u9","q":"马达蛋白有哪些？分别向哪端运输？","a":"驱动蛋白向微管正端运输，动力蛋白向微管负端运输；肌球蛋白沿微丝运动。","note":"马达蛋白水解 ATP 供能。","pdf":"细胞骨架质膜课件2026.pdf","page":20,"slide":"assets/slides/kp_70_u9.webp"},{"id":"k71","u":"u9","q":"中心体和基体的关系是什么？","a":"中心体含一对中心粒，是微管组织中心；基体位于纤毛/鞭毛基部，由中心粒衍生而来。","note":"中心体参与纺锤体形成。","pdf":"细胞骨架质膜课件2026.pdf","page":15,"slide":"assets/slides/kp_71_u9.webp"},{"id":"k72","u":"u9","q":"EMT 是什么？","a":"上皮-间质转化：上皮细胞失去极性和连接，获得间质细胞表型和迁移能力，参与胚胎发育和肿瘤转移。","note":"E-cadherin 下降、vimentin 升高。","pdf":"细胞骨架质膜课件2026.pdf","page":36,"slide":"assets/slides/kp_72_u9.webp"},{"id":"k73","u":"u10","q":"核糖体的结构和功能是什么？","a":"由 rRNA 和蛋白质组成的非膜性细胞器，是蛋白质合成的场所；原核 70S，真核 80S。","note":"游离核糖体合成胞内蛋白，膜结合核糖体合成分泌蛋白。","pdf":"核糖体、内质网、高尔基体2026.pdf","page":13,"slide":"assets/slides/kp_73_u10.webp"},{"id":"k74","u":"u10","q":"粗面内质网和滑面内质网有什么区别？","a":"粗面内质网表面有核糖体，合成和加工蛋白质；滑面内质网无核糖体，合成脂质、解毒和储存 Ca²⁺。","note":"两者膜腔相通。","pdf":"核糖体、内质网、高尔基体2026.pdf","page":30,"slide":"assets/slides/kp_74_u10.webp"},{"id":"k75","u":"u10","q":"高尔基体的功能是什么？","a":"对来自内质网的蛋白质进行糖基化、修饰、分选和包装，形成分泌小泡或溶酶体。","note":"高尔基体有顺面（cis）和反面（trans）。","pdf":"核糖体、内质网、高尔基体2026.pdf","page":58,"slide":"assets/slides/kp_75_u10.webp"},{"id":"k76","u":"u10","q":"COPII 和 COPI 小泡分别负责什么运输？","a":"COPII 负责内质网到高尔基体的顺向运输；COPI 负责高尔基体到内质网的逆向运输。","note":"KDEL 信号通过 COPI 回收。","pdf":"核糖体、内质网、高尔基体2026.pdf","page":39,"slide":"assets/slides/kp_76_u10.webp"},{"id":"k77","u":"u10","q":"SRP 和转位通道的作用是什么？","a":"SRP 识别新生肽链的 N 端信号肽，将其带到内质网膜，肽链经转位通道进入内质网腔。","note":"分泌蛋白共翻译转运。","pdf":"核糖体、内质网、高尔基体2026.pdf","page":36,"slide":"assets/slides/kp_77_u10.webp"},{"id":"k78","u":"u10","q":"溶酶体的结构和功能是什么？","a":"由单层膜包被，内含多种酸性水解酶，pH 约 5，负责降解胞吞物质、衰老细胞器和自噬体。","note":"溶酶体是细胞的“消化车间”。","pdf":"内体、溶酶体、蛋白酶体、线粒体2026.pdf","page":5,"slide":"assets/slides/kp_78_u10.webp"},{"id":"k79","u":"u10","q":"自噬的基本过程是什么？","a":"双层膜形成自噬体，包裹待降解物，与溶酶体融合形成自噬溶酶体，降解产物被回收利用。","note":"自噬是生存应激反应。","pdf":"内体、溶酶体、蛋白酶体、线粒体2026.pdf","page":21,"slide":"assets/slides/kp_79_u10.webp"},{"id":"k80","u":"u10","q":"蛋白酶体的结构和功能是什么？","a":"呈中空圆桶状，20S 核心负责降解，19S 调节颗粒识别泛素化蛋白，降解错误折叠或短寿命蛋白。","note":"与溶酶体分工不同。","pdf":"内体、溶酶体、蛋白酶体、线粒体2026.pdf","page":39,"slide":"assets/slides/kp_80_u10.webp"},{"id":"k81","u":"u11","q":"线粒体嵴的结构和意义是什么？","a":"内膜向内折叠形成嵴，显著扩大内膜表面积，有利于电子传递和 ATP 合成。","note":"心肌细胞线粒体嵴密集。","pdf":"内体、溶酶体、蛋白酶体、线粒体2026.pdf","page":44,"slide":"assets/slides/kp_81_u11.webp"},{"id":"k82","u":"u11","q":"电子传递链的功能是什么？","a":"位于线粒体内膜，接受 NADH 和 FADH₂ 的电子，逐步传递并泵出质子，建立质子动力势。","note":"电子最终传给 O₂ 生成 H₂O。","pdf":"内体、溶酶体、蛋白酶体、线粒体2026.pdf","page":47,"slide":"assets/slides/kp_82_u11.webp"},{"id":"k83","u":"u11","q":"ATP 合酶如何合成 ATP？","a":"质子顺梯度回流，驱动 c 环和 γ 轴旋转，引起 β 亚基构象变化，将 ADP + Pi 合成 ATP。","note":"化学渗透偶联。","pdf":"内体、溶酶体、蛋白酶体、线粒体2026.pdf","page":50,"slide":"assets/slides/kp_83_u11.webp"},{"id":"k84","u":"u11","q":"氧化磷酸化是什么？","a":"NADH/FADH₂ 氧化释放的电子经呼吸链传递，偶联质子泵出和 ATP 合成。","note":"细胞 ATP 的主要来源。","pdf":"内体、溶酶体、蛋白酶体、线粒体2026.pdf","page":50,"slide":"assets/slides/kp_84_u11.webp"},{"id":"k85","u":"u11","q":"mtDNA 的特点是什么？","a":"线粒体 DNA 为双链环状，可多拷贝，编码少量线粒体蛋白，呈母系遗传。","note":"线粒体是半自主性细胞器。","pdf":"内体、溶酶体、蛋白酶体、线粒体2026.pdf","page":54,"slide":"assets/slides/kp_85_u11.webp"},{"id":"k86","u":"u11","q":"线粒体分裂和融合的意义是什么？","a":"分裂增加线粒体数量并清除损伤部分；融合交换内容物、互补功能，维持线粒体网络健康。","note":"二者平衡是质量控制的关键。","pdf":"内体、溶酶体、蛋白酶体、线粒体2026.pdf","page":56,"slide":"assets/slides/kp_86_u11.webp"},{"id":"k87","u":"u11","q":"线粒体自噬是什么？","a":"通过自噬选择性清除损伤或多余的线粒体，维持线粒体质量和细胞稳态。","note":"PINK1/Parkin 通路参与。","pdf":"内体、溶酶体、蛋白酶体、线粒体2026.pdf","page":56,"slide":"assets/slides/kp_87_u11.webp"},{"id":"k88","u":"u11","q":"线粒体途径凋亡的关键事件是什么？","a":"线粒体膜通透性增加，细胞色素 c 释放到胞质，激活 caspase 级联，导致细胞凋亡。","note":"MPTP 开放是重要机制。","pdf":"内体、溶酶体、蛋白酶体、线粒体2026.pdf","page":62,"slide":"assets/slides/kp_88_u11.webp"},{"id":"k89","u":"u12","q":"核孔复合体的功能是什么？","a":"介导核质之间大分子的选择性运输，小分子可自由扩散，大分子需核定位信号和转运受体。","note":"核孔复合体由多种核孔蛋白组成。","pdf":"细胞核课件2026.pdf","page":10,"slide":"assets/slides/kp_89_u12.webp"},{"id":"k90","u":"u12","q":"核纤层的组成和功能是什么？","a":"位于内核膜下，由核纤层蛋白（lamin）组成的纤维网络，支撑核膜、锚定染色质。","note":"lamin 突变可导致核纤层病。","pdf":"细胞核课件2026.pdf","page":13,"slide":"assets/slides/kp_90_u12.webp"},{"id":"k91","u":"u12","q":"常染色质和异染色质有什么区别？","a":"常染色质较松散、转录活跃；异染色质高度浓缩、转录受抑。","note":"两者可相互转化。","pdf":"细胞核课件2026.pdf","page":17,"slide":"assets/slides/kp_91_u12.webp"},{"id":"k92","u":"u12","q":"核小体的结构是什么？","a":"由 146 bp DNA 缠绕组蛋白八聚体 1.75 圈构成，H1 结合在 DNA 进出点。","note":"染色质的基本结构单位。","pdf":"细胞核课件2026.pdf","page":25,"slide":"assets/slides/kp_92_u12.webp"},{"id":"k93","u":"u12","q":"核型分析有什么用途？","a":"观察染色体的数目和形态，用于诊断染色体数目异常、结构畸变和肿瘤相关改变。","note":"如唐氏综合征 21 三体。","pdf":"细胞核课件2026.pdf","page":20,"slide":"assets/slides/kp_93_u12.webp"},{"id":"k94","u":"u12","q":"核仁的三个亚区是什么？","a":"纤维中心（FC）、致密纤维组分（DFC）和颗粒组分（GC），分别对应 rRNA 基因、rRNA 加工和核糖体前体组装。","note":"核仁是无膜的大分子凝聚体。","pdf":"细胞核课件2026.pdf","page":54,"slide":"assets/slides/kp_94_u12.webp"},{"id":"k95","u":"u12","q":"中心法则的内容是什么？","a":"遗传信息从 DNA 转录到 RNA，再翻译成蛋白质；DNA 可自我复制。","note":"逆转录是对中心法则的补充。","pdf":"细胞核课件2026.pdf","page":42,"slide":"assets/slides/kp_95_u12.webp"},{"id":"k96","u":"u12","q":"染色质重塑是什么？","a":"通过重塑因子复合体改变核小体位置、组成或结构，调节染色质可及性和基因转录。","note":"与组蛋白修饰协同。","pdf":"细胞核课件2026.pdf","page":47,"slide":"assets/slides/kp_96_u12.webp"}];

function loadState(){
  const def = {p:{}, kp:{}, h:{}, goal:20, theme:'auto'};
  if(!storageOk) return def;
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return def;
    const o = JSON.parse(raw);
    return {p:o.p||{}, kp:o.kp||{}, h:o.h||{}, goal:o.goal||20, theme:o.theme||'auto'};
  }catch(e){ return def; }
}
let S = loadState();
function save(){
  if(!storageOk) return;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ storageOk=false; }
}
function pad(n){return String(n).padStart(2,'0')}
function dkey(d=new Date()){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pOf(id){

}
function kpOf(id){
  if(!S.kp[id]) S.kp[id]={box:0,due:0,seen:false,right:0,wrong:0,last:''};
  return S.kp[id];
}
function kpStatus(k){
  const p=S.kp[k.id];
  if(!p||!p.seen) return 'new';
  return p.box>=4?'mastered':'learning';
}
function statusOf(w){
  const p=S.p[w.id];
  if(!p||!p.seen) return 'new';
  return p.box>=4?'mastered':'learning';
}
function todayCount(){return S.h[dkey()]||0}
function dueWords(){
  const now=Date.now();
  return DATA.filter(w=>{const p=S.p[w.id];return p&&p.seen&&p.box<5&&p.due<=now});
}
function newWords(){return DATA.filter(w=>!S.p[w.id]||!S.p[w.id].seen)}
function streak(){
  let n=0; const d=new Date();
  if(!S.h[dkey(d)]) d.setDate(d.getDate()-1);
  for(let i=0;i<3660;i++){
    if((S.h[dkey(d)]||0)>0){n++;d.setDate(d.getDate()-1)} else break;
  }
  return n;
}
function unitStats(uid){
  const ws=DATA.filter(w=>w.u===uid);
  let m=0,s=0;
  ws.forEach(w=>{const st=statusOf(w);if(st==='mastered')m++;else if(st==='learning')s++});
  return {total:ws.length,mastered:m,learning:s,new:ws.length-m-s};
}

function toast(msg){
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),1800);
}
function showReward(kind){
  const ov=document.getElementById('rewardOverlay');
  if(!ov) return;
  const img=document.getElementById('rewardImg');
  img.style.opacity='1';
  img.style.aspectRatio = kind==='wrong' ? '3/4' : '9/16';
  const badge=document.getElementById('rewardBadge');
  const name=document.getElementById('rewardName');
  const series=document.getElementById('rewardSeries');
  const quote=document.getElementById('rewardQuote');
  if(kind==='wrong'){
    img.src=WRONG_IMG;
    badge.textContent='错题留念'; badge.classList.add('bad');
    name.textContent='你'; series.textContent='';
    quote.textContent=WRONG_CAPS[Math.floor(Math.random()*WRONG_CAPS.length)];
  }else{
    const r=(REWARDS.length?REWARDS[Math.floor(Math.random()*REWARDS.length)]:null);
    if(!r){toast('图库还没加载');return}
    img.src=r.src;
    badge.textContent='奖励'; badge.classList.remove('bad');
    name.textContent=r.name; series.textContent='· '+r.series;
    quote.textContent=GOOD_CAPS[Math.floor(Math.random()*GOOD_CAPS.length)];
  }
  img.onerror=()=>{img.style.opacity='.2'};
  ov.classList.add('show');
  document.body.style.overflow='hidden';
}
function closeReward(){
  const ov=document.getElementById('rewardOverlay');
  if(ov) ov.classList.remove('show');
  document.body.style.overflow='';
}
function showSlide(k){

function speak(e,text){
  if(e){e.stopPropagation();e.preventDefault()}
  if(!('speechSynthesis' in window)){toast('当前浏览器不支持朗读');return}
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=.82; u.pitch=1;
    const vs=window.speechSynthesis.getVoices().filter(v=>/^en(-|_)/i.test(v.lang));
    const pref=vs.find(v=>/Samantha|Alex|Ava|Allison|Susan|Google US English|Microsoft Aria|Microsoft Jenny/i.test(v.name))||vs[0];
    if(pref) u.voice=pref;
    window.speechSynthesis.speak(u);
  }catch(err){toast('朗读启动失败')}
}
if('speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged=()=>{}; }
function speakWord(e,id){const w=BY_ID[id];if(w)speak(e,w.t)}

function buildQueue(unitId, extra){
  const now=Date.now();
  if(unitId){
    const ws=DATA.filter(w=>w.u===unitId);
    return ws.sort((a,b)=>{
      const pa=S.p[a.id]||{}, pb=S.p[b.id]||{};
      const sa=pa.seen?(pa.box>=4?2:1):0, sb=pb.seen?(pb.box>=4?2:1):0;
      if(sa!==sb) return sa-sb;
      return (pa.due||0)-(pb.due||0);
    });
  }
  if(extra){
    const pool=shuffle(DATA.filter(w=>{const p=S.p[w.id];return !p||!p.seen||(p.seen&&p.box<4)}));
    return pool.slice(0,extra);
  }
  const due=dueWords().sort((a,b)=>(S.p[a.id].due||0)-(S.p[b.id].due||0));
  const remain=Math.max(0,S.goal-todayCount());
  const fresh=shuffle(newWords()).slice(0,remain);
  return [...due,...fresh];
}
function startStudy(unitId, extra){
  const q=buildQueue(unitId||null, extra||0);
  if(!q.length){
    toast('这一轮完成了，去测验或随机再来 10 个');
    go('quiz'); return;
  }
  study={queue:q.map(w=>w.id), idx:0, revealed:false, unit:unitId||null, extra:extra||0, stats:{again:0,hard:0,good:0}};
  document.body.classList.add('focus');
  document.getElementById('view').classList.add('focus');
  renderStudy();
}

function statusLabel(st){return st==='new'?'未学':st==='mastered'?'已掌握':'学习中'}
function flipCard(){
  if(!study) return;
  study.revealed=!study.revealed;
  const el=document.getElementById('flashcard');
  if(el) el.classList.toggle('flipped',study.revealed);
}
function toggleStar(e){
  if(e){e.stopPropagation()}
  if(!study||study.idx>=study.queue.length) return;
  const w=BY_ID[study.queue[study.idx]]; const p=pOf(w.id);
  p.star=!p.star; save();
  const btn=document.querySelector('.study-top .star');
  if(btn){btn.classList.toggle('on',p.star);btn.textContent=p.star?'★':'☆'}
  toast(p.star?'已收藏':'已取消收藏');
}
function grade(q){
  if(!study||study.idx>=study.queue.length) return;
  if(!study.revealed){ flipCard(); toast('先看一眼释义，再选择'); return; }
  const w=BY_ID[study.queue[study.idx]]; const p=pOf(w.id); const now=Date.now();
  if(q==='again'){p.box=0;p.due=now+10*60*1000;p.wrong++;study.stats.again++}
  else if(q==='hard'){p.box=Math.max(1,p.box);p.due=now+24*3600*1000;p.wrong++;study.stats.hard++}
  else {p.box=Math.min(5,p.box+1);p.due=now+INTERVALS[Math.min(p.box,5)]*24*3600*1000;p.right++;study.stats.good++}
  p.seen=true; p.last=dkey();
  S.h[dkey()]=(S.h[dkey()]||0)+1;
  save();
  study.idx++; study.revealed=false;
  renderStudy();
  if(q==='good') showReward('good');
  else if(q==='again') showReward('wrong');
  window.scrollTo({top:0,behavior:'auto'});
}
function renderDone(){

      <div class="hint" style="margin-top:18px">今日已学 ${tc} / ${S.goal} 词 · 已掌握 ${mastered} / ${total}</div>
    </div>
  `;
}

function setLibFilter(f){state.libFilter=f;renderLibrary()}
function filteredWords(){
  const q=state.libQuery.trim().toLowerCase();
  return DATA.filter(w=>{
    if(state.libUnit!=='all' && w.u!==state.libUnit) return false;
    const st=statusOf(w);
    if(state.libFilter==='new'&&st!=='new') return false;
    if(state.libFilter==='learning'&&st!=='learning') return false;
    if(state.libFilter==='mastered'&&st!=='mastered') return false;
    if(state.libFilter==='star'&&!(S.p[w.id]&&S.p[w.id].star)) return false;
    if(q && !(w.t.toLowerCase().includes(q)||w.zh.toLowerCase().includes(q)||(w.note||'').toLowerCase().includes(q))) return false;
    return true;
  });
}
function renderLibList(){
  const el=document.getElementById('libList'); if(!el) return;
  const ws=filteredWords();
  if(!ws.length){el.innerHTML='<div class="empty"><b>没有匹配的词</b>换个关键词或筛选条件试试</div>';return}
  const groups={};
  ws.forEach(w=>{(groups[w.u]=groups[w.u]||[]).push(w)});
  let html='';
  UNITS.forEach(u=>{
    const list=groups[u.id]; if(!list||!list.length) return;
    const st=unitStats(u.id);
    html+=`<div class="list-head"><span>${escapeHtml(u.name)}</span><span>${st.mastered}/${st.total} 已掌握</span></div>`;
    html+=list.map(w=>{
      const st=statusOf(w); const star=S.p[w.id]&&S.p[w.id].star;
      return `<button class="word-row" onclick="showWord('${w.id}')">
        <span class="dot ${st}"></span>
        <span class="word-main"><span class="word-term">${escapeHtml(w.t)}</span><span class="word-zh">${escapeHtml(w.zh)}</span></span>
        <span class="star ${star?'on':''}" onclick="toggleListStar(event,'${w.id}')">${star?'★':'☆'}</span>
      </button>`;
    }).join('');
  });
  el.innerHTML=html;
}

function startKp(unitId){
  let pool=unitId?KP.filter(k=>k.u===unitId):KP;
  if(!pool.length){toast('这个单元还没有考点');return}
  kpSession={queue:shuffle(pool).slice(0,10).map(k=>k.id),idx:0,revealed:false,unit:unitId||null,stats:{again:0,hard:0,good:0}};
  document.body.classList.add('focus');
  document.getElementById('view').classList.add('focus');
  renderKpStudy();
}
function renderKpStudy(){
  if(!kpSession||kpSession.idx>=kpSession.queue.length){renderKpDone();return}
  const k=KP_BY_ID[kpSession.queue[kpSession.idx]];
  const u=UNIT[k.u];
  const pct=Math.round(kpSession.idx/kpSession.queue.length*100);
  document.getElementById('view').innerHTML=`
    <div class="flash-wrap">
      <div class="study-top">
        <button class="icon-btn" onclick="go('knowledge')" aria-label="返回">←</button>
        <div class="study-progress"><div class="bar"><i style="width:${pct}%"></i></div><div class="meta"><span>${escapeHtml(u.name)}</span><span>${kpSession.idx+1} / ${kpSession.queue.length}</span></div></div>
        <button class="icon-btn" onclick="showSlide(KP_BY_ID['${k.id}'])" aria-label="PPT">▤</button>
      </div>
      <div class="kp-qcard">
        <div class="unit-pill">考点 ${kpSession.idx+1}</div>
        <div class="kp-q" style="margin-top:12px">${escapeHtml(k.q)}</div>
        ${kpSession.revealed?`
          <div class="kp-a">${escapeHtml(k.a)}</div>
          ${k.note?`<div class="kp-note">${escapeHtml(k.note)}</div>`:''}
          <div class="kp-src">出处：${escapeHtml(k.pdf)} · 第 ${k.page} 页</div>
        `:`<div class="hint" style="margin-top:24px">先自己回想，再看答案</div>`}
      </div>
      ${kpSession.revealed?`
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
          <button class="btn ghost" onclick="showSlide(KP_BY_ID['${k.id}'])">看 PPT 上下文</button>
          <button class="btn ghost" style="color:var(--red)" onclick="gradeKp('again')">不会</button>
          <button class="btn ghost" style="color:var(--amber)" onclick="gradeKp('hard')">模糊</button>
          <button class="btn primary" onclick="gradeKp('good')">会了</button>
        </div>`:`
        <button class="btn primary wide" style="margin-top:14px" onclick="revealKp()">看答案</button>`}
      ${kpSession.revealed?'':''}
    </div>`;
}
function revealKp(){ if(kpSession){kpSession.revealed=true;renderKpStudy()} }
function gradeKp(q){
  if(!kpSession||kpSession.idx>=kpSession.queue.length) return;
  const k=KP_BY_ID[kpSession.queue[kpSession.idx]]; const p=kpOf(k.id); const now=Date.now();
  if(q==='again'){p.box=0;p.due=now+10*60*1000;p.wrong++;kpSession.stats.again++}
  else if(q==='hard'){p.box=Math.max(1,p.box);p.due=now+24*3600*1000;p.wrong++;kpSession.stats.hard++}
  else {p.box=Math.min(5,p.box+1);p.due=now+INTERVALS[Math.min(p.box,5)]*24*3600*1000;p.right++;kpSession.stats.good++}
  p.seen=true;p.last=dkey();save();
  kpSession.idx++;kpSession.revealed=false;
  renderKpStudy();
  if(q==='good') showReward('good'); else if(q==='again') showReward('wrong');
}
function renderKpDone(){
  const st=kpSession?kpSession.stats:{again:0,hard:0,good:0};
  const n=kpSession?kpSession.queue.length:0;
  document.getElementById('view').innerHTML=`
    <div class="done">
      <div class="done-ico">✓</div>
      <h2>这组考点完成</h2>
      <p>不会的已经记下来了，下次抽背还会遇到。</p>
      <div class="done-stats"><div><b>${n}</b><span>本组考点</span></div><div><b>${st.good}</b><span>会了</span></div><div><b>${st.again}</b><span>不会</span></div></div>
      <div class="done-actions"><button class="btn primary" onclick="startKp()">再抽 10 个</button><button class="btn ghost" onclick="go('knowledge')">回知识页</button></div>
    </div>`;
}

function makeQuiz(n, scope){
  const unit=document.getElementById('quizUnit')?.value||'all';
  lastQuizUnit=unit;
  let pool=DATA.filter(w=>unit==='all'||w.u===unit);
  if(scope==='due') pool=dueWords().filter(w=>unit==='all'||w.u===unit);
  if(pool.length<4){toast('这个范围词太少，换一个吧');return null}
  pool=shuffle(pool);
  const qs=[];
  for(const w of pool){
    if(qs.length>=n) break;
    const dir=Math.random()<.5?'en2zh':'zh2en';
    const correct=dir==='en2zh'?w.zh:w.t;
    const opts=[correct];
    const cands=shuffle(DATA.filter(x=>x.id!==w.id));
    for(const c of cands){
      const val=dir==='en2zh'?c.zh:c.t;
      if(!opts.includes(val)) opts.push(val);
      if(opts.length===4) break;
    }
    if(opts.length<4) continue;
    qs.push({id:w.id,dir,correct,options:shuffle(opts)});
  }
  return qs;
}
function startQuiz(n, scope){
  const qs=makeQuiz(n,scope); if(!qs) return;
  quiz={qs,i:0,score:0,answered:false,selected:null,wrong:[],unit:lastQuizUnit};
  document.body.classList.remove('focus');document.getElementById('view').classList.remove('focus');
  renderQuiz();
}
function renderQuiz(){
  if(!quiz) return renderQuizHome();
  if(quiz.i>=quiz.qs.length) return renderQuizResult();
  const q=quiz.qs[quiz.i]; const w=BY_ID[q.id];
  const pct=Math.round(quiz.i/quiz.qs.length*100);
  document.getElementById('view').innerHTML=`
    <div class="quiz-top">
      <button class="icon-btn" onclick="go('quiz')" aria-label="退出">←</button>
      <div class="quiz-bar"><i style="width:${pct}%"></i></div>
      <div class="quiz-count">${quiz.i+1}/${quiz.qs.length}</div>
    </div>
    <div class="question-card">
      <div class="q-dir">${q.dir==='en2zh'?'英文 → 中文':'中文 → 英文'}</div>
      <div class="q-term ${q.dir==='zh2en'?'cn':''}">${escapeHtml(q.dir==='en2zh'?w.t:w.zh)}</div>
      ${q.dir==='en2zh'&&w.note?`<div class="q-note">${escapeHtml(w.note)}</div>`:''}
    </div>
    <div class="answers" id="answers">
      ${q.options.map((o,i)=>`<button class="answer" data-i="${i}" onclick="answerQuiz(${i})" ${quiz.answered?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${escapeHtml(o)}</span></button>`).join('')}
    </div>
    ${quiz.answered?`<div class="feedback ${quiz.selected===q.correct?'ok':'no'}">${quiz.selected===q.correct?'✓ 答对了':'✕ 正确答案：'+escapeHtml(q.correct)}</div><button class="btn primary wide" style="margin-top:12px" onclick="nextQuiz()">下一题 →</button>`:''}
  `;
  if(quiz.answered){
    document.querySelectorAll('#answers .answer').forEach(b=>{
      const t=b.querySelector('span:last-child').textContent;
      if(t===q.correct) b.classList.add('correct');
      else if(t===quiz.selected) b.classList.add('wrong');
    });
  }
}
function answerQuiz(i){
  if(!quiz||quiz.answered) return;
  const q=quiz.qs[quiz.i];
  const chosen=q.options[i];
  quiz.answered=true; quiz.selected=chosen;
  if(chosen===q.correct){quiz.score++}
  else{quiz.wrong.push(q.id); const p=pOf(q.id);p.seen=true;p.box=0;p.due=Date.now()+10*60*1000;p.wrong++;p.last=dkey();save()}
  renderQuiz();
}
function nextQuiz(){
  if(!quiz) return;
  quiz.i++; quiz.answered=false; quiz.selected=null;
  if(quiz.i>=quiz.qs.length) renderQuizResult(); else renderQuiz();
  window.scrollTo({top:0,behavior:'instant'});
}
function renderQuizResult(){
  const pct=Math.round(quiz.score/quiz.qs.length*100);
  const wrong=quiz.wrong.map(id=>BY_ID[id]).filter(Boolean);
  document.getElementById('view').innerHTML=`
    <div class="quiz-result">
      <div class="score-ring" style="--score:${pct}"><div><b>${pct}%</b><span>${quiz.score} / ${quiz.qs.length}</span></div></div>
      <h2 class="h2">${pct>=80?'很稳，继续保持':pct>=60?'及格线以上，再巩固一下':'别急，错题就是重点'}</h2>
      <p class="sub" style="margin-top:6px">${wrong.length?'答错的词已回到学习队列，明天会优先出现。':'这一组没有错题，漂亮。'}</p>
      <div class="done-actions" style="margin:20px auto 0">
        <button class="btn primary" onclick="go('quiz')">再来一组</button>
        <button class="btn ghost" onclick="go('quiz')">返回</button>
      </div>
      ${wrong.length?`<div class="wrong-list"><div class="list-head"><span>错题回顾</span><span>${wrong.length} 个</span></div>${wrong.map(w=>`<div class="word-row"><span class="dot learning"></span><span class="word-main"><span class="word-term">${escapeHtml(w.t)}</span><span class="word-zh">${escapeHtml(w.zh)}</span></span></div>`).join('')}</div>`:''}
      <div class="footer-note">错题会自动重置记忆盒，下次优先复习</div>
    </div>
  `;
  window.scrollTo({top:0,behavior:'instant'});
}

function setGoal(n){S.goal=n;save();renderMe();toast('每日目标已设为 '+n+' 词')}
function exportProgress(){
  try{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='分细组背单词进度.json';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    toast('已导出学习记录');
  }catch(e){toast('导出失败，可截图保存')}
}
function resetProgress(){
  if(!confirm('确定清空所有学习进度、收藏和统计吗？此操作不可撤销。')) return;
  S={p:{},kp:{},h:{},goal:S.goal,theme:S.theme};save();toast('进度已清空');renderMe();
}

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
document.addEventListener('keydown',e=>{
  if(!study||study.idx>=study.queue.length) return;
  if(e.code==='Space'){e.preventDefault();flipCard()}
  else if(e.key==='1')grade('again');
  else if(e.key==='2')grade('hard');
  else if(e.key==='3')grade('good');
});
go('home');
</script>
</body>
</html>
